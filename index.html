<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache">
<title>OW INBOX · 통합 메시지 센터</title>
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f1115'/%3E%3Ctext x='32' y='42' font-family='Georgia' font-size='28' font-weight='700' fill='%23d4b06a' text-anchor='middle'%3EOW%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#0f1115;--bg2:#151820;--bg3:#1b1f29;--bg4:#232836;--line:#262b38;--line2:#323848;
  --tx:#e8eaf0;--tx2:#a4aabb;--tx3:#6d7488;--gold:#d4b06a;--blue:#5b8cff;--green:#3ecf8e;--red:#ff5d5d;--amber:#ffb547;
  --r:12px;--font:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--tx);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;word-break:keep-all}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2a3040;border-radius:8px}::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-columns:250px 400px 1fr;height:100vh}
/* sidebar */
.side{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand .mk{width:34px;height:34px;border-radius:10px;background:#0b0d11;border:1px solid #3a3222;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;color:var(--gold);font-size:15px}
.brand b{font-size:15.5px;letter-spacing:.02em}
.brand small{display:block;font-size:11.5px;color:var(--tx3);margin-top:-2px}
.sync{margin:0 12px 10px;padding:10px 12px;background:var(--bg3);border:1px solid var(--line);border-radius:10px;font-size:12.5px;color:var(--tx2)}
.sync b{color:var(--tx);font-weight:600}
.sync .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px;box-shadow:0 0 0 3px rgba(62,207,142,.15)}
.sync .dot.off{background:var(--tx3);box-shadow:none}
.nav{flex:1;overflow:auto;padding:4px 10px 10px}
.nav h6{font-size:11.5px;font-weight:600;color:var(--tx3);letter-spacing:.06em;padding:14px 8px 6px}
.ni{display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border-radius:9px;color:var(--tx2);font-size:14px;text-align:left;transition:background .15s}
.ni:hover{background:var(--bg3);color:var(--tx)}
.ni.on{background:var(--bg4);color:var(--tx)}
.ni .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11.5px;font-weight:800;flex:none}
.ni .ic svg{width:16px;height:16px}
.ni .ct{margin-left:auto;font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums}
.ni .ct.new{background:var(--red);color:#fff;font-weight:700;border-radius:20px;padding:0 7px;min-width:20px;text-align:center}
.ni .st{width:6px;height:6px;border-radius:50%;flex:none;margin-left:6px}
.side-foot{border-top:1px solid var(--line);padding:10px;display:flex;gap:6px}
.side-foot button{flex:1;padding:8px;border-radius:8px;background:var(--bg3);color:var(--tx2);font-size:12.5px;border:1px solid var(--line)}
.side-foot button:hover{color:var(--tx);border-color:var(--line2)}

/* list */
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.lh{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.lh .t{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lh h1{font-size:18px;font-weight:700;letter-spacing:-.02em}
.lh .add{padding:6px 11px;border-radius:8px;background:var(--gold);color:#16130b;font-weight:700;font-size:12.5px}
.search{margin-top:12px;position:relative}
.search input{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:9px 12px 9px 34px;font-size:13.5px;outline:0}
.search input:focus{border-color:var(--line2)}
.search svg{position:absolute;left:11px;top:50%;width:15px;height:15px;transform:translateY(-50%);color:var(--tx3)}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chips button{flex:none;padding:5px 10px;border-radius:20px;border:1px solid var(--line);color:var(--tx2);font-size:12.5px}
.chips button.on{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.stats div{padding:10px 16px}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.stats span{font-size:11.5px;color:var(--tx3)}
.items{flex:1;overflow:auto}
.it{display:grid;grid-template-columns:38px 1fr auto;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;transition:background .12s}
.it:hover{background:var(--bg2)}
.it.on{background:var(--bg3)}
.it.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:13px;position:relative;flex:none}
.av .pf{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:9.5px;font-weight:900;border:2px solid var(--bg)}
.it .nm{display:flex;align-items:center;gap:6px;min-width:0}
.it .nm b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.unread .nm b{font-weight:800}
.it .pv{font-size:13px;color:var(--tx2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.it.unread .pv{color:var(--tx)}
.it .meta{text-align:right;font-size:11.5px;color:var(--tx3);white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.it .ud{width:8px;height:8px;border-radius:50%;background:var(--blue)}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;white-space:nowrap}
.star{color:var(--amber);font-size:12px}
.empty{padding:50px 26px;text-align:center;color:var(--tx3);font-size:13.5px}
.empty b{display:block;color:var(--tx2);font-size:15px;margin-bottom:6px}
.empty button{margin-top:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--line2);color:var(--tx2)}

/* detail */
.detail{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.dh{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
.dh .av{width:44px;height:44px;border-radius:13px;font-size:15px}
.dh h2{font-size:17px;font-weight:700;letter-spacing:-.02em}
.dh p{font-size:12.5px;color:var(--tx3)}
.dh .acts{margin-left:auto;display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);color:var(--tx2);font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--line2);color:var(--tx)}
.btn.pri{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:700}
.btn.pri:hover{background:#fff}
.btn svg{width:15px;height:15px}
.db{flex:1;overflow:auto;display:grid;grid-template-columns:1fr 300px;min-height:0}
.conv{padding:22px;overflow:auto;border-right:1px solid var(--line)}
.conv h5,.panel h5{font-size:11.5px;font-weight:600;color:var(--tx3);letter-spacing:.06em;margin-bottom:10px}
.bub{background:var(--bg3);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:12px 14px;max-width:560px;font-size:14px;white-space:pre-wrap;margin-bottom:6px}
.bubt{font-size:11.5px;color:var(--tx3);margin:0 0 16px 4px}
.note-box{margin-top:22px;padding:14px;border:1px dashed var(--line2);border-radius:12px;font-size:12.5px;color:var(--tx3)}
.tpls{margin-top:22px}
.tp{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;transition:border-color .15s}
.tp:hover{border-color:var(--gold)}
.tp b{font-size:13.5px;font-weight:600}
.tp span{font-size:12px;color:var(--tx3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.tp em{margin-left:auto;font-style:normal;font-size:12px;color:var(--gold);white-space:nowrap}
.panel{padding:22px 18px;overflow:auto}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:22px}
.sts button{padding:8px 6px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;color:var(--tx2)}
.sts button.on{color:#0f1115;font-weight:700;border-color:transparent}
.panel textarea{width:100%;min-height:130px;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;resize:vertical;outline:0}
.panel textarea:focus{border-color:var(--line2)}
.kv{margin-top:22px;font-size:12.5px}
.kv div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);gap:10px}
.kv span{color:var(--tx3)}
.kv b{font-weight:500;text-align:right;word-break:break-all}
.blank{flex:1;display:grid;place-items:center;color:var(--tx3);text-align:center;padding:40px}
.blank .big{font-family:Georgia,serif;font-size:56px;color:#2a2f3c;font-weight:700}
.back{display:none}

/* connections */
.conn{padding:26px;overflow:auto;flex:1}
.conn h2{font-size:20px;font-weight:700;margin-bottom:6px}
.conn > p{color:var(--tx2);font-size:13.5px;margin-bottom:20px;max-width:720px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cc{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px}
.cc .h{display:flex;align-items:center;gap:10px}
.cc .h .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:13px}
.cc .h b{font-size:15px}
.cc .h small{display:block;font-size:12px;color:var(--tx3)}
.cc .s{margin-top:12px;font-size:12.5px;display:flex;align-items:center;gap:6px}
.cc .s i{width:7px;height:7px;border-radius:50%}
.cc .f{display:flex;gap:6px;margin-top:12px}
.cc .f a,.cc .f button{flex:1;text-align:center;padding:7px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;color:var(--tx2)}
.cc .f a:hover,.cc .f button:hover{color:var(--tx);border-color:var(--line2)}
.how{margin-top:22px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px 20px;font-size:13.5px;color:var(--tx2);max-width:900px}
.how b{color:var(--tx)}
.how ol{margin:10px 0 0 18px}.how li{margin:5px 0}

/* modal */
.mb{position:fixed;inset:0;background:rgba(5,6,9,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.mb.open{display:flex}
.md{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:22px}
.md h3{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.md h3 button{color:var(--tx3);font-size:20px}
.fl{margin-bottom:12px}
.fl label{display:block;font-size:12px;color:var(--tx3);margin-bottom:5px;font-weight:600}
.fl input,.fl textarea,.fl select{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14px;outline:0}
.fl textarea{min-height:110px;resize:vertical}
.fl input:focus,.fl textarea:focus,.fl select:focus{border-color:var(--gold)}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.tl-row{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.tl-row div{flex:1;min-width:0}
.tl-row b{font-size:13.5px}
.tl-row p{font-size:12px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* lock */
.lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.lock.open{display:flex}
.lock .mk{width:64px;height:64px;border-radius:18px;background:#0b0d11;border:1px solid #3a3222;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;color:var(--gold);font-size:26px}
.lock input{background:var(--bg3);border:1px solid var(--line2);border-radius:12px;padding:12px 16px;font-size:22px;letter-spacing:.5em;text-align:center;width:220px;outline:0}
.lock p{color:var(--tx3);font-size:13px}
.lock .err{color:var(--red)}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:120}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* AI */
.ni.ai{background:linear-gradient(90deg,rgba(212,176,106,.16),rgba(212,176,106,.02));color:var(--tx);border:1px solid rgba(212,176,106,.25);margin-bottom:4px}
.ni.ai.on{background:linear-gradient(90deg,rgba(212,176,106,.3),rgba(212,176,106,.06))}
.aiw{flex:1;display:flex;flex-direction:column;min-height:0}
.aih{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.aih .orb{width:40px;height:40px;border-radius:12px;background:radial-gradient(circle at 30% 30%,#f3d79a,#b8862f 60%,#5a3d10);box-shadow:0 0 24px rgba(212,176,106,.35)}
.aih h2{font-size:17px;font-weight:700}.aih p{font-size:12.5px;color:var(--tx3)}
.aim{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:760px;font-size:14px;white-space:pre-wrap;line-height:1.6}
.msg.u{align-self:flex-end;background:var(--bg4);padding:10px 14px;border-radius:14px 14px 4px 14px}
.msg.a{align-self:flex-start;background:var(--bg2);border:1px solid var(--line);padding:12px 15px;border-radius:4px 14px 14px 14px}
.msg.a.think{color:var(--tx3)}
.act{margin-top:10px;border:1px solid var(--line2);border-radius:12px;padding:12px;background:var(--bg3);white-space:normal}
.act .ah{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--tx2);margin-bottom:8px}
.act textarea{width:100%;min-height:90px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.5px;resize:vertical;outline:0;line-height:1.55}
.act textarea:focus{border-color:var(--gold)}
.act .ab{display:flex;gap:6px;margin-top:8px;justify-content:flex-end;flex-wrap:wrap}
.act.done{opacity:.75}
.applied{font-size:12.5px;color:var(--green);margin-top:8px}
.sug{display:flex;flex-wrap:wrap;gap:6px;padding:0 22px 10px}
.sug button{padding:7px 11px;border-radius:20px;border:1px solid var(--line);font-size:12.5px;color:var(--tx2)}
.sug button:hover{border-color:var(--gold);color:var(--tx)}
.aii{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;align-items:flex-end}
.aii textarea{flex:1;background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14px;resize:none;outline:0;max-height:160px;min-height:46px;line-height:1.5}
.aii textarea:focus{border-color:var(--gold)}
.aii button{height:46px;padding:0 18px;border-radius:12px;background:var(--gold);color:#16130b;font-weight:800}
.aii button:disabled{opacity:.4}
.bub.me{margin-left:auto;background:rgba(212,176,106,.12);border-color:rgba(212,176,106,.3);border-radius:14px 4px 14px 14px}
.bubt.me{text-align:right;margin-right:4px}
.compose{margin-top:22px;border:1px solid var(--line2);border-radius:12px;padding:12px;background:var(--bg2)}
.compose textarea{width:100%;min-height:110px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;resize:vertical;outline:0;line-height:1.55}
.compose textarea:focus{border-color:var(--gold)}
.compose .cb{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.compose .cb .sp{flex:1}
.vars{display:grid;gap:6px;margin-top:8px}
.vars button{text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;color:var(--tx2);white-space:pre-wrap}
.vars button:hover{border-color:var(--gold);color:var(--tx)}
.ob{padding:22px;overflow:auto;flex:1}
.ob h2{font-size:20px;font-weight:700}
.ob > p{color:var(--tx2);font-size:13.5px;margin:6px 0 18px;max-width:760px}
.oi{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--bg2)}
.oi .oh{display:flex;align-items:center;gap:8px;font-size:13px}
.oi .ot{margin-top:8px;font-size:13.5px;white-space:pre-wrap;color:var(--tx)}
.oi textarea{width:100%;margin-top:8px;min-height:80px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.5px;resize:vertical;outline:0}
.oi .ab{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--tx3);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:1180px){.app{grid-template-columns:220px 360px 1fr}.db{grid-template-columns:1fr}.conv{border-right:0}.panel{border-top:1px solid var(--line)}}
@media (max-width:860px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto;min-height:100vh}
  .side{display:none}
  .side.mopen{display:flex;position:fixed;inset:0;z-index:40;width:82%;max-width:300px}
  .list{height:100vh}
  .detail{position:fixed;inset:0;z-index:30;display:none}
  .detail.mopen{display:flex}
  .back{display:inline-flex}
  .mnav{display:inline-flex!important}
  .tp span{max-width:220px}
}
.mnav{display:none}

/* ===== 새 메시지 팝업 ===== */
.ntfs{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:10px;width:370px;max-width:calc(100vw - 24px);pointer-events:none}
.ntf{pointer-events:auto;background:var(--bg2);border:1px solid var(--line2);border-left:4px solid var(--gold);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.55);padding:13px 14px 12px;animation:ntfIn .35s cubic-bezier(.2,.8,.2,1);font-family:var(--font);color:var(--tx)}
@keyframes ntfIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.ntf .nh{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--tx3);font-weight:700}
.ntf .nh .live{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(255,93,93,.22);animation:nblink 1.2s infinite}
@keyframes nblink{50%{opacity:.35}}
.ntf .nh .x3{margin-left:auto;border:0;background:none;color:var(--tx3);cursor:pointer;font-size:15px;line-height:1}
.ntf .who{display:flex;align-items:center;gap:8px;margin:8px 0 2px}
.ntf .pfb{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;white-space:nowrap}
.ntf .who b{font-size:15px;word-break:keep-all;line-height:1.3}

/* ===== ingest API (Aside 수집 루틴이 호출) =====
   OwenInbox.ingest('kmong',[{id,name,preview,time,unread,url}],{ok:true})  */
function ingest(pf, list, meta={}){
  if(!PF[pf]) throw new Error('unknown platform '+pf);
  DB = load();
  const now=new Date().toISOString(); let added=0, updated=0; const fresh=[];
  (list||[]).forEach(m=>{
    const key = pf+':'+(m.id||m.url||m.name);
    const ex = DB.items[key];
    const ts = parseTime(m.time) || now;
    if(!ex){
      DB.items[key]={key,pf,name:m.name||'(이름 없음)',preview:m.preview||'',time:ts,timeRaw:m.time||'',unread:!!m.unread,url:m.url||PF[pf].inbox,
        status:'new',memo:'',star:false,archived:false,firstSeen:now,lastSeen:now,log:[{t:ts,x:m.preview||''}],source:'auto'};
      added++; fresh.push(DB.items[key]);
    }else{
      const changed = m.preview && m.preview!==ex.preview;
      ex.name=m.name||ex.name; ex.url=m.url||ex.url; ex.lastSeen=now; ex.timeRaw=m.time||ex.timeRaw;
      if(changed){ex.preview=m.preview;ex.time=ts;ex.log=(ex.log||[]).concat([{t:ts,x:m.preview}]).slice(-50);ex.unread=true;ex.archived=false;updated++;fresh.push(ex)}
      else if(m.unread) ex.unread=true;
    }
  });
  DB.meta[pf]=Object.assign(DB.meta[pf]||{},{lastSync:now,ok:meta.ok!==false,error:meta.error||'',count:(list||[]).length});
  DB.meta.lastRun=now; save(); render();
  return {pf,added,updated,new:fresh.map(x=>({name:x.name,preview:x.preview}))};
}
function parseTime(s){
  if(!s) return null; if(/^\d{4}-\d{2}-\d{2}T/.test(s)) return s;
  const now=new Date(); let m;
  if(m=s.match(/(\d+)\s*분\s*전/)) return new Date(now-m[1]*6e4).toISOString();
  if(m=s.match(/(\d+)\s*시간\s*전/)) return new Date(now-m[1]*36e5).toISOString();
  if(m=s.match(/(\d+)\s*일\s*전/)) return new Date(now-m[1]*864e5).toISOString();
  if(/방금/.test(s)) return now.toISOString();
  if(/어제/.test(s)) return new Date(now-864e5).toISOString();
  if(m=s.match(/(오전|오후)\s*(\d{1,2}):(\d{2})/)){const d=new Date();let h=+m[2]%12+(m[1]==='오후'?12:0);d.setHours(h,+m[3],0,0);return d.toISOString()}
  if(m=s.match(/^(\d{1,2}):(\d{2})$/)){const d=new Date();d.setHours(+m[1],+m[2],0,0);return d.toISOString()}
  if(m=s.match(/(\d{4})[.\-/]\s*(\d{1,2})[.\-/]\s*(\d{1,2})/)) return new Date(+m[1],m[2]-1,+m[3]).toISOString();
  if(m=s.match(/(\d{1,2})월\s*(\d{1,2})일/)) return new Date(now.getFullYear(),m[1]-1,+m[2]).toISOString();
  if(m=s.match(/^(\d{1,2})[.\/](\d{1,2})$/)) return new Date(now.getFullYear(),m[1]-1,+m[2]).toISOString();
  return null;
}

function outboxQueued(){DB=load();return (DB.outbox||[]).filter(o=>o.status==='queued').map(o=>({id:o.id,pf:o.pf,platform:PF[o.pf].n,name:o.name,url:o.url,inbox:PF[o.pf].inbox,text:o.text,approvedAt:o.approvedAt}))}
function markSending(id){DB=load();const o=(DB.outbox||[]).find(x=>x.id===id);if(!o||o.status!=='queued')return false;o.status='sending';o.tries=(o.tries||0)+1;save();render();return true}
function markSent(id,ok,error){DB=load();const o=(DB.outbox||[]).find(x=>x.id===id);if(!o)return false;const now=new Date().toISOString();
  if(ok){o.status='sent';o.sentAt=now;o.error='';const it=DB.items[o.key];if(it){it.log=(it.log||[]).concat([{t:now,x:o.text,me:true}]).slice(-50);if(it.status==='new')it.status='talk'}}
  else{o.status='failed';o.error=error||'발송 실패'}
  save();render();return true}

async function aiCall(system, contents, json=true){
  const c=aiCfg();
  if(!(c.key&&c.useOwn)){
    let last;
    for(let round=0;round<2;round++){
      try{
        const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),90000);
        const r=await fetch(AI_PROXY,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+AI_PUB,'apikey':AI_PUB},body:JSON.stringify({system,contents,json,model:c.manual?c.model:undefined})});

        if(r.status===429)break;
      }catch(e){last=e.name==='AbortError'?new Error('AI 응답이 너무 늦어요'):(e.message&&!/형식/.test(e.message)?new Error('AI 서버에 연결하지 못했어요'):e)}
      await new Promise(r=>setTimeout(r,1500));
    }
    throw last;
  }
  const pick=c.model&&MODELS.includes(c.model)&&c.manual?c.model:null;
  const order=pick?[pick].concat(MODELS.filter(m=>m!==pick)):MODELS.slice();
  let last;
  for(let round=0;round<2;round++){
    for(const m of order){
      try{
        const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),30000);
        const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(c.key)}`,{method:'POST',headers:{'Content-Type':'application/json'},signal:ctl.signal,
          body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents,generationConfig:Object.assign({temperature:.6},json?{responseMimeType:'application/json'}:{})})});
        clearTimeout(to);
        const d=await r.json().catch(()=>({}));
        if(!r.ok){const msg=(d.error&&d.error.message)||('HTTP '+r.status);
          if(r.status===400&&/API key/i.test(msg)) throw Object.assign(new Error('Gemini 키가 올바르지 않아요 (설정에서 다시 넣어주세요)'),{fatal:true});
          last=new Error(r.status===503||r.status===429?'Gemini 서버가 붐벼요. 잠시 후 다시 시도해 주세요':msg);continue}
        const t=(d.candidates?.[0]?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');
        if(!t){last=new Error('AI 응답이 비어 있어요');continue}
        window.__aiModel=m;
        if(!json) return t;
        try{return JSON.parse(t.replace(/^\s*```(json)?\s*|\s*```\s*$/g,''))}catch(e){const mm=t.match(/\{[\s\S]*\}/);if(mm)return JSON.parse(mm[0]);last=new Error('AI 응답 형식 오류');continue}
      }catch(e){if(e.fatal)throw e;last=e.name==='AbortError'?new Error('AI 응답이 너무 늦어요'):e}
    }
    await new Promise(r=>setTimeout(r,1500));
  }
  throw last||new Error('AI 호출 실패');
}

function pickTexts(r){if(!r)return[];if(Array.isArray(r))return r.map(x=>typeof x==='string'?x:(x.text||x.message||'')).filter(Boolean);
  for(const k of ['options','replies','drafts','candidates','messages'])if(Array.isArray(r[k]))return pickTexts(r[k]);
  if(Array.isArray(r.actions)){const s=r.actions.filter(a=>a.text).map(a=>a.text);if(s.length)return s}
  if(r.text)return[r.text];if(r.reply)return[r.reply];return[]}
function queueSend(key,text,status='draft'){
  const it=DB.items[key]; if(!it) return null;
  const o={id:'o'+uid(),key,pf:it.pf,name:it.name,url:it.url,text,status,created:new Date().toISOString(),approvedAt:status==='queued'?new Date().toISOString():null};
  DB.outbox=(DB.outbox||[]); DB.outbox.unshift(o); save(); return o;
}
function approve(id,text){DB=load();const o=DB.outbox.find(x=>x.id===id);if(!o)return;if(text!=null)o.text=text;o.status='queued';o.approvedAt=new Date().toISOString();save();render();toast('발송 대기열에 넣었어요 · 10분 안에 Aside가 보냅니다')}
function applyAction(a){
  const it=a.key&&DB.items[a.key];
  switch(a.type){
    case 'status': if(it&&STATUS.some(s=>s.k===a.status)){it.status=a.status;return `${it.name} → ${(STATUS.find(s=>s.k===a.status)).n}`}break;
    case 'memo': if(it){it.memo=a.mode==='replace'?a.text:((it.memo?it.memo+'\n':'')+a.text);return `${it.name} 메모 저장`}break;
    case 'star': if(it){it.star=a.on!==false;return `${it.name} ${it.star?'별표':'별표 해제'}`}break;
    case 'archive': if(it){it.archived=a.on!==false;return `${it.name} ${it.archived?'보관':'보관 해제'}`}break;
    case 'read': if(it){it.unread=false;return `${it.name} 읽음 처리`}break;
    case 'template': if(a.n&&a.t){DB.tpl.push({id:'t'+uid(),n:a.n,t:a.t});return `템플릿 "${a.n}" 추가`}break;
  }
  return null;
}

function renderMsg(m,idx){
  if(m.role==='user') return `<div class="msg u">${esc(m.text)}</div>`;
  const acts=(m.sends||[]).map(sid=>{const o=(DB.outbox||[]).find(x=>x.id===sid);if(!o)return'';const it=DB.items[o.key];const p=PF[o.pf];
    const live=o.status==='draft';
    return `<div class="act ${live?'':'done'}" data-o="${o.id}"><div class="ah"><span class="tag" style="background:${p.c};color:${p.fg}">${p.n}</span><b style="color:var(--tx)">${esc(o.name)}</b>에게 보낼 메시지<span class="tag" style="margin-left:auto;background:${OBST[o.status][1]}22;color:${OBST[o.status][1]}">${OBST[o.status][0]}</span></div>
      ${live?`<textarea>${esc(o.text)}</textarea><div class="ab"><button class="btn" data-cancel>취소</button><button class="btn" data-open>대화 보기</button><button class="btn pri" data-ok>승인하고 보내기</button></div>`:`<div style="font-size:13.5px;white-space:pre-wrap">${esc(o.text)}</div>`}</div>`}).join('');

}
function bindAI(){
  const aim=$('aim'); aim.scrollTop=aim.scrollHeight;
  const inp=$('aiIn'); inp.oninput=()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,160)+'px'};
  inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();askAI()}};
  $('aiGo').onclick=askAI;
  $('aiClear').onclick=()=>{DB.chat=[];save();renderDetail()};
  if($('aiSetKey'))$('aiSetKey').onclick=()=>$('btnSet').click();
  document.querySelectorAll('.sug button').forEach(b=>b.onclick=()=>{inp.value=b.textContent;askAI()});
  aim.querySelectorAll('.act[data-o]').forEach(el=>{const id=el.dataset.o;
    const ok=el.querySelector('[data-ok]'),ca=el.querySelector('[data-cancel]'),op=el.querySelector('[data-open]');
    if(ok)ok.onclick=()=>approve(id,el.querySelector('textarea').value.trim());
    if(ca)ca.onclick=()=>{const o=DB.outbox.find(x=>x.id===id);o.status='canceled';save();render()};
    if(op)op.onclick=()=>{const o=DB.outbox.find(x=>x.id===id);view.pf='all';select(o.key)};
  });
}
let aiBusy=false;
async function askAI(){
  const inp=$('aiIn'); const q=inp.value.trim(); if(!q||aiBusy)return;
  aiBusy=true; DB.chat=(DB.chat||[]).concat([{role:'user',text:q}]); save(); renderDetail();
  $('aim').insertAdjacentHTML('beforeend','<div class="msg a think" id="think"><span class="spin"></span>생각 중…</div>'); $('aim').scrollTop=1e9; $('aiGo').disabled=true;
  try{
    const hist=DB.chat.slice(-12).map(m=>({role:m.role==='user'?'user':'model',parts:[{text:m.role==='user'?m.text:JSON.stringify({reply:m.text})}]}));
    const r=await aiCall(sysPrompt(),hist);
    DB=load(); const sends=[], applied=[];
    (r.actions||[]).forEach(a=>{
      if(a.type==='send'){ if(DB.items[a.key]&&a.text){const o=queueSend(a.key,a.text,'draft');if(o)sends.push(o.id)} }
      else{const res=applyAction(a);if(res)applied.push(res)}

/* ===== 새 메시지 팝업: 어디서 · 누가 · 무슨 내용 + 바로 이동하기 ===== */
const POPKEY='owInbox.popSeen';
const sigOf=it=>it.key+'|'+(it.preview||'');
let popSeen=null;
try{const a=JSON.parse(localStorage.getItem(POPKEY));if(Array.isArray(a))popSeen=new Set(a)}catch(e){}

function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,.16].forEach((t,k)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=k?1175:880;g.gain.setValueAtTime(1e-4,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.18,c.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(1e-4,c.currentTime+t+.25);o.connect(g).connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+.3)})}catch(e){}}
const locked=()=>$('lock')&&$('lock').classList.contains('open');

function popOne(it){
  const box=$('ntfs'),p=PF[it.pf]||{n:it.pf,c:'#888',fg:'#fff'};
  const el=document.createElement('div');el.className='ntf';el.dataset.k=it.key;
  if(locked()){el.innerHTML='<div class="nh"><span class="live"></span>새 메시지가 도착했어요<button class="x3" data-nx>✕</button></div><div class="msg">잠금 상태라 내용은 숨겼어요. PIN을 입력하면 볼 수 있어요.</div>'}
  else el.innerHTML=`<div class="nh"><span class="live"></span>새 메시지 · ${esc(rel(it.time)||'방금')}<button class="x3" data-nx title="닫기">✕</button></div>
  <div class="who"><span class="pfb" style="background:${p.c};color:${p.fg}">${esc(p.n)}</span><b>${esc(it.name)}</b></div>
  <div class="msg">${esc(it.preview||'(내용 미리보기 없음)')}</div>
  <div class="na"><button class="go" data-ngo>바로 이동하기</button><a href="${esc(it.url||p.inbox||'#')}" target="_blank" rel="noopener" data-nopen>${esc(p.n)}에서 열기</a><button data-nx>닫기</button></div>`;
  box.prepend(el);
  while(box.querySelectorAll('.ntf[data-k]').length>4){const l=[...box.querySelectorAll('.ntf[data-k]')].pop();l.remove()}
  if('Notification' in window&&Notification.permission==='granted'&&document.hidden&&!locked()){
    try{const n=new Notification(`[${p.n}] ${it.name}`,{body:(it.preview||'').slice(0,140),tag:'ow-'+it.key});n.onclick=()=>{window.focus();goMsg(it.key);n.close()}}catch(e){}
  }
}
function checkNew(silent){
  const fresh=all().filter(it=>!it.archived&&it.unread&&!popSeen.has(sigOf(it))).sort((a,b)=>new Date(a.time)-new Date(b.time));
  all().forEach(it=>popSeen.add(sigOf(it)));savePop();
  if(!fresh.length||silent)return;
  const show=fresh.slice(-3);show.forEach(popOne);
  if(fresh.length>3){const m=document.createElement('div');m.className='ntf more';m.textContent=`그 외 새 메시지 ${fresh.length-3}건 더 · 눌러서 안 읽음 보기`;m.onclick=()=>{m.remove();view.pf='unread';render()};$('ntfs').append(m)}
  beep();
}

/* ===== 홈페이지 문의 (NO-SITE CLINIC 문의 페이지 · 데모 사이트 버튼) 실시간 수집 ===== */
const NS_FN='https://crrsswrrdpzmdlrgkfoi.supabase.co/functions/v1/nosite-inbox';
const HOOK_LAST='owInbox.hookLast';
async function pollWeb(){
  const k=localStorage.getItem('nosite-admin-key');if(!k)return;
  try{
    const since=+localStorage.getItem(HOOK_LAST)||0;
    const r=await fetch(NS_FN,{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':k},body:JSON.stringify(since?{action:'list',since}:{action:'list'})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();const rows=d.rows||[];DB=load();
    const groups={web:[],gmail:[],sms:[]};
    rows.forEach(q=>{const ch=groups[q.channel]?q.channel:'web';const id='q'+q.id;if(DB.items[ch+':'+id])return;
      let m;
      if(ch==='gmail')m={id,name:q.hname||q.sender||'(보낸 사람 없음)',preview:q.message||'',time:q.created_at,unread:true,url:q.page||PF.gmail.inbox};
      else if(ch==='sms'){const num=(q.sender||'').replace(/[^0-9+]/g,'');m={id,name:q.hname||q.sender||'(번호 없음)',preview:q.message||'',time:q.created_at,unread:true,url:num?'sms:'+num:'sms:'}}
      else m={id,name:(q.hname||'이름 없는 병원')+(q.sender?' · '+q.sender:''),preview:(q.source?'['+q.source+'] ':'')+(q.message||'')+(q.contact?'\n연락처: '+q.contact:''),time:q.created_at,unread:true,url:q.page&&/ask\.html/.test(q.page)?'https://jake12733.github.io/nosite-clinic/':(q.page||PF.web.inbox)};
      groups[ch].push(m)});
    let any=false;
    for(const [pf,list] of Object.entries(groups)){if(list.length){window.OwenInbox.ingest(pf,list,{ok:true});any=true}}
    if(rows.length)localStorage.setItem(HOOK_LAST,String(Math.max(since,...rows.map(q=>q.id))));
    if(rows.length||!DB.meta.gmail||!DB.meta.sms){DB=load();const now=new Date().toISOString();
    ['web','gmail','sms'].forEach(pf=>{DB.meta[pf]=Object.assign(DB.meta[pf]||{},{lastSync:now,ok:true,error:'',count:all().filter(i=>i.pf===pf).length})});
    save();renderNav();}
  }catch(e){}
}
pollWeb();setInterval(pollWeb,10000);

/* lock */
(async()=>{
  if(DB.pin && sessionStorage.getItem('owInbox.unlocked')!==DB.pin){
    $('lock').classList.add('open');$('pin').focus();
    $('pin').oninput=async e=>{const v=e.target.value;if(v.length>=4&&await hash(v)===DB.pin){sessionStorage.setItem('owInbox.unlocked',DB.pin);$('lock').classList.remove('open');render()}
      else if(v.length===6){$('lockMsg').textContent='PIN이 맞지 않아요';$('lockMsg').className='err';e.target.value=''}};
  }
  render();
})();
